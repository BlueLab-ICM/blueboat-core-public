# Secret and lab-infrastructure scan, run by pre-commit and CI.
#
#   gitleaks git --verbose     # scan the full history
#
# A false positive on a line that must stay goes in .gitleaksignore as the
# fingerprint gitleaks prints.

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private or Tailscale IPv4 address"
regex = '''\b(?:10(?:\.\d{1,3}){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2}|192\.168(?:\.\d{1,3}){2}|100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])(?:\.\d{1,3}){2})\b'''
tags = ["hardcoded"]

# Subnets that are the same on every vehicle or phone, so naming them leaks nothing.
[[rules.allowlists]]
description = "Vehicle LAN, vehicle hotspot, and phone hotspot defaults"
regexTarget = "match"
regexes = [
  '''^192\.168\.2\.\d{1,3}$''',
  '''^192\.168\.5\.\d{1,3}$''',
  '''^172\.20\.10\.\d{1,3}$''',
  '''^192\.168\.43\.\d{1,3}$''',
]

[[rules]]
id = "tailnet-hostname"
description = "Tailscale MagicDNS hostname"
regex = '''\b[a-z0-9-]+\.[a-z0-9-]+\.ts\.net\b'''
tags = ["hardcoded"]

[[rules]]
id = "home-directory"
description = "Absolute path into a user home directory"
regex = '''(?:/home|/Users)/([a-z_][a-z0-9_.-]*)/'''
# The default global allowlist drops path-shaped secrets, so report the user name.
secretGroup = 1
tags = ["hardcoded"]

# Paths inside an image are the same on every host.
[[rules.allowlists]]
description = "Container paths"
paths = ['''(?:^|/)Dockerfile[^/]*$''']
